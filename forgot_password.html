<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <div class="container mx-auto mt-10">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg rounded-lg">
                    <div class="card-body p-5">
                        <h1 class="text-3xl font-semibold text-center mb-4 text-gray-800">Forgot Password</h1>
                        <div id="forgot-password-error" class="text-red-500 text-center mb-3"></div>
                        <form id="forgot-password-form">
                            <div class="mb-3">
                                <label for="username" class="form-label text-gray-700 font-medium">Username:</label>
                                <input type="text" class="form-control rounded-md shadow-sm border-gray-300 focus:border-blue-500 focus:ring-blue-500" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="dob" class="form-label text-gray-700 font-medium">Date of Birth:</label>
                                <input type="date" class="form-control rounded-md shadow-sm border-gray-300 focus:border-blue-500 focus:ring-blue-500" id="dob" name="dob" required>
                            </div>
                            <div class="mb-3">
                                <label for="security-question" class="form-label text-gray-700 font-medium">Security Question:</label>
                                <select class="form-select rounded-md shadow-sm border-gray-300 focus:border-blue-500 focus:ring-blue-500" id="security-question" name="security-question" required>
                                    <option value="">Select a question</option>
                                    <option value="pet">What is your first pet's name?</option>
                                    <option value="city">What city were you born in?</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label for="security-answer" class="form-label text-gray-700 font-medium">Answer:</label>
                                <input type="text" class="form-control rounded-md shadow-sm border-gray-300 focus:border-blue-500 focus:ring-blue-500" id="security-answer" name="security-answer" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary rounded-md py-2">Reset Password</button>
                            </div>
                        </form>
                        <div class="mt-4 text-center">
                            <a href="index.html" class="text-blue-500 hover:text-blue-700">Back to Login</a>
                        </div>
                                    </div>
                </div>
            </div>
                        <!-- <div class="mt-4 text-center">
                            <a href="index.html" class="text-blue-500 hover:text-blue-700">Back to Login</a>
                        </div> -->
                    </div>
                    <form id="new-password-form" class="mt-4" style="display: none;">
                    <div class="mb-3">
                        <label for="new-password" class="form-label text-gray-700 font-medium">New Password:</label>
                        <input type="password" class="form-control rounded-md shadow-sm border-gray-300 focus:border-blue-500 focus:ring-blue-500" id="new-password" name="new-password" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm-password" class="form-label text-gray-700 font-medium">Confirm Password:</label>
                        <input type="password" class="form-control rounded-md shadow-sm border-gray-300 focus:border-blue-500 focus:ring-blue-500" id="confirm-password" name="confirm-password" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success rounded-md py-2">Update Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
